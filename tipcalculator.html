<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <style>
    html, body {
      background-color: #f4f4f9;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    .container {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background-color: #fff;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      gap: 15px;
      padding: 30px 40px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 300px;
    }
    h2 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 10px;
      color: #333;
    }
    label {
      font-size: 14px;
      font-weight: bold;
      color: #444;
    }
    input[type='number'] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      width: 100%;
    }
    button {
      background-color: #4CAF50;
      border: none;
      height: 35px;
      color: #fff;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }
    .result {
      background: #f9f9f9;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      color: #333;
    }
    .error {
      color: red;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h2>Tip Calculator</h2>
      <p id="text">Enter the bill amount and tip percentage to calculate the tip and total.</p>
      
      <label for="amount">Bill Amount</label>
      <input type="number" placeholder="Enter amount" id="amount">
      
      <label for="percentage">Tip Percentage</label>
      <input type="number" placeholder="Enter percentage" id="percentage">
      
      <button type="button" onclick="calculateTip()">CALCULATE</button>
      
      <p id="error" class="error"></p>
      
      <div class="result">
        <p>Tip Amount: <output id="tipAmount">0.00</output></p>
        <p>Total Amount: <output id="totalAmount">0.00</output></p>
      </div>
    </div>
  </div>

  <script>
    function calculateTip() {
      const amount = parseFloat(document.getElementById('amount').value);
      const percentage = parseFloat(document.getElementById('percentage').value);
      const errorMsg = document.getElementById('error');
      const tipOutput = document.getElementById('tipAmount');
      const totalOutput = document.getElementById('totalAmount');

      // Reset error
      errorMsg.textContent = "";

      // Validate inputs
      if (isNaN(amount) || isNaN(percentage) || amount <= 0 || percentage < 0) {
        errorMsg.textContent = "⚠️ Please enter valid positive numbers.";
        tipOutput.textContent = "0.00";
        totalOutput.textContent = "0.00";
        return;
      }

      // Calculate tip and total
      const tipAmount = (amount * percentage) / 100;
      const totalAmount = amount + tipAmount;

      // Display results
      tipOutput.textContent = tipAmount.toFixed(2);
      totalOutput.textContent = totalAmount.toFixed(2);
    }
  </script>
</body>
</html>
